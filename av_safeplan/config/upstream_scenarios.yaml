version: 1
town: Town12

sources:
  scenario_runner:
    repository: https://github.com/carla-simulator/scenario_runner.git
    revision: v0.9.15
    directory: scenario_runner
  leaderboard:
    repository: https://github.com/carla-simulator/leaderboard.git
    revision: leaderboard-2.0
    directory: leaderboard

families:
  lead_brake:
    selection: scenario
    scenario_types:
      - HardBreakRoute
      - FollowLeadingVehicle
    required_criteria:
      - CollisionTest
    expected_outcome: A reproducible lead-vehicle braking conflict with an official route result.
    requires_live_validation: true

  cross_traffic:
    selection: scenario
    scenario_types:
      - NoSignalJunctionCrossing
      - OppositeVehicleRunningRedLight
      - CrossingBicycleFlow
      - EnterActorFlow
    required_criteria:
      - CollisionTest
    expected_outcome: A reproducible intersection conflict with an official route result.
    requires_live_validation: true

  red_light_compliance:
    selection: route
    scenario_types:
      - SignalizedJunctionLeftTurn
      - SignalizedJunctionRightTurn
      - OppositeVehicleRunningRedLight
    required_criteria:
      - RunningRedLightTest
    expected_outcome: A Town12 route that reaches a signalized junction and is scored by RunningRedLightTest.
    requires_live_validation: true
