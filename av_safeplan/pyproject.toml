[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "av-safeplan"
version = "0.1.0"
description = "Modular safety-supervision research infrastructure for CARLA"
requires-python = ">=3.8,<3.9"
dependencies = ["PyYAML==6.0.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
